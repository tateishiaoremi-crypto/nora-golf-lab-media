name: Ingest media

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    if: startsWith(github.event.issue.title, '[media-ingest]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download media listed in issue
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess
          body = os.environ.get("ISSUE_BODY", "")
          lines = [x.strip() for x in body.splitlines() if x.strip()]
          for line in lines:
              if "|" not in line:
                  continue
              filename, url = line.split("|", 1)
              filename = filename.strip()
              url = url.strip()
              if not filename or not url:
                  continue
              if "/" in filename or "\\" in filename:
                  raise SystemExit(f"invalid filename: {filename}")
              subprocess.run(["curl","-L","--fail","--silent","--show-error",url,"-o",filename], check=True)
          PY

      - name: Commit media
        run: |
          set -euo pipefail
          git config user.name "nora-golf-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add media for Instagram publishing"
            git push
          fi

      - name: Scrub temporary URLs from issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --body "Media ingested automatically."
          gh issue close "$ISSUE_NUMBER" --reason completed
