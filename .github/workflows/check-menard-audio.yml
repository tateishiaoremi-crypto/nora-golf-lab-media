name: Check Menard swing audio tracks

on:
  push:
    branches: [main]
    paths:
      - "posts/2026-10-10-menard/audio-check-trigger.txt"

permissions:
  contents: write

jobs:
  inspect-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Inspect sync timestamps and non-silence
        run: |
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          base=Path("posts/2026-10-10-menard/carousel")
          report=[]
          for name in ["swing-01.mp4","swing-02.mp4","swing-03.mp4","swing-04.mp4","swing-05-mori.mp4"]:
              p=base/name
              x=subprocess.run(["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(p)],capture_output=True,text=True,check=True)
              m=json.loads(x.stdout)
              streams=m["streams"]
              v=next(s for s in streams if s["codec_type"]=="video")
              a=next(s for s in streams if s["codec_type"]=="audio")
              d=float(m["format"]["duration"])
              delta=float(a.get("start_time",0))-float(v.get("start_time",0))
              x=subprocess.run(["ffmpeg","-nostdin","-hide_banner","-i",str(p),"-vn","-af","volumedetect","-f","null","-"],capture_output=True,text=True,check=True)
              z=re.search(r"max_volume:\s*(-?[\d.]+) dB",x.stderr)
              max_db=float(z.group(1)) if z else None
              report.append({"file":name,"duration_seconds":round(d,3),"video_start_seconds":v.get("start_time"),"audio_start_seconds":a.get("start_time"),"audio_vs_video_start_delta_seconds":round(delta,3),"maximum_audio_decibels":max_db})
          output=base/"audio_qa.json"
          output.write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if any(abs(item["audio_vs_video_start_delta_seconds"])>0.08 for item in report):
              raise RuntimeError("A/V start offsets exceed 80ms; investigate from source")
          if any(item["maximum_audio_decibels"] is None for item in report):
              raise RuntimeError("Unable to measure sound level")
          PY
      - name: Save QA metadata
        run: |
          git config user.name "nora-golf-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/2026-10-10-menard/carousel/audio_qa.json
          git commit -m "Record Menard swing audio timing and volume QA [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
